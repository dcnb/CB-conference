{% comment %}
    Speaker Search/Filter Component
    Search and filter controls for speaker directory
    Requires: conference.js for search functionality
{% endcomment %}

<div class="speaker-search-controls mb-4">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="speaker-search-input" class="form-label">Search Speakers</label>
      <div class="input-group">
        <span class="input-group-text">
          <i class="bi bi-search"></i>
        </span>
        <input type="text"
               class="form-control"
               id="speaker-search-input"
               placeholder="Search by name or affiliation..."
               aria-label="Search speakers">
      </div>
      <small class="form-text text-muted">
        Type to filter speakers by name or institution
      </small>
    </div>

    <div class="col-md-6 mb-3">
      <label for="speaker-role-filter" class="form-label">Filter by Role</label>
      <select class="form-select" id="speaker-role-filter" aria-label="Filter by role">
        <option value="all" selected>All Roles</option>

        {% comment %} Collect unique roles from participants {% endcomment %}
        {% assign all_roles = "" | split: "" %}
        {% for participant in site.data.participants %}
          {% if participant.role and participant.role != "" %}
            {% unless all_roles contains participant.role %}
              {% assign all_roles = all_roles | push: participant.role %}
            {% endunless %}
          {% endif %}
        {% endfor %}

        {% assign sorted_roles = all_roles | uniq | sort %}
        {% for role in sorted_roles %}
          <option value="{{ role }}">{{ role | capitalize }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <span id="speaker-count" class="text-muted">
            <span id="visible-count">0</span> of <span id="total-count">0</span> speakers
          </span>
        </div>
        <div>
          <button type="button" class="btn btn-sm btn-outline-secondary" id="reset-speaker-filters">
            <i class="bi bi-x-circle"></i> Reset Filters
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
