##########
# Conference Platform
# Built on CollectionBuilder-CSV
# Static website framework for academic conferences
# https://github.com/CollectionBuilder/collectionbuilder-csv
##########

##########
# CONFERENCE SETTINGS
#
# Primary conference information - appears throughout the site
conference:
  title: "National Interdisciplinary Lookout Conference"
  short_title: "NILC 2026"
  year: 2026
  dates: "June 15-17, 2026"
  location: "University of Idaho"
  city: "Moscow, Idaho"

  # Key Dates
  key_dates:
    - label: "Abstract Submission Opens"
      date: "2025-12-01"
    - label: "Submission Deadline"
      date: "2026-02-15"
    - label: "Notification of Acceptance"
      date: "2026-03-15"
    - label: "Early Registration Deadline"
      date: "2026-04-30"
    - label: "Conference Dates"
      date: "2026-06-15"

  # Registration
  registration:
    url: "https://example.com/register"
    open: true
    early_bird_deadline: "2026-04-30"
    prices:
      regular: "$180"
      student: "$75"
      virtual: "$50"

  # Submission
  submission:
    url: "https://example.com/submit"
    open: false
    types:
      - "Paper (20 min)"
      - "Panel (90 min)"
      - "Poster"
      - "Workshop (half-day)"

  # Social Media
  social:
    twitter: "@NILCconf"
    hashtag: "#NILC2026"

  # Contact
  contact_email: "conference@uidaho.edu"

##########
# URL VARIABLES
#
# site domain, full URL to the production location of your collection
url:
# path to location on the domain if necessary e.g. /digital/hjccc
baseurl:
# location of code, the full url to your github repository
source-code: https://github.com/CollectionBuilder/collectionbuilder-csv

##########
# SITE SETTINGS
#
# title of site appears in banner (use conference.title for most pages)
title: National Interdisciplinary Lookout Conference
# tagline, a short phrase that will appear throughout the site in the top banner
tagline: Interdisciplinary Research and Creative Expression
# description appears in meta tags and other locations
# this description might appear in search result lists, keep around 160 characters max
description: "Annual conference bringing together scholars and practitioners in interdisciplinary research, creative expression, and digital scholarship."
# keywords, a short list of subjects describing the collection, separated by semicolon, to appear in rich markup
keywords: conference; interdisciplinary; research; digital humanities
# creator of the digital collection, to appear in meta tags
author: Conference Organizers

##########
# COLLECTION SETTINGS
#
# Set the metadata for your collection (the name of the CSV file in your _data directory that describes the objects in your collection)
# Use the filename of your CSV **without** the ".csv" extension! E.g. _data/demo-metadata.csv --> "demo-metadata"
metadata: conference-metadata 
# page generation settings [optional!]
# [optional: only used if you need to tweak CB defaults or generate from more than one data file]
# page_gen:
#   - data: 'demo-metadata'
#     template: 'item'
#     name: 'objectid'
#     dir: 'items'
#     extension: 'html' 
#     filter: 'objectid'  

##########
# ORGANIZATION SETTINGS
#
# Enter name and link for your organization (replacing the name and links below)
# These values will be used in attribution and data 
organization-name: "Center for Digital Inquiry and Learning (CDIL)"
organization-link: https://cdil.lib.uidaho.edu/
# Add logo image links if you would like them to appear in banner and footer. Delete or leave blank to remove logos.
organization-logo-banner: https://www.lib.uidaho.edu/collectionbuilder/cdil-black.png
organization-logo-nav: https://www.lib.uidaho.edu/collectionbuilder/cdil-white.png

##########
# ROBOTS EXCLUDE
#
# set noindex to true if you do NOT want Google to index your site
# noindex: true

##########
# BUILD SETTINGS
#
# Note: use environment variable on build command to include analytics
# JEKYLL_ENV=production jekyll build
# (this is done automatically by gh-pages build)
#
# Library directory location. This allows you to customize where the standard assets are found.
# provide a relative path in this repository or full url
lib-assets: /assets/lib
# ignore stuff
exclude: [docs/, Rakefile, rakelib/, README.md, LICENSE, CITATION.cff, CODE_OF_CONDUCT.md, CONTRIBUTING.md, SECURITY.md, conference-platform-instructions.md, Claude.md, plan.md]
# compress CSS output
sass:
  style: compressed
