{%- comment -%}
  Schema.org JSON-LD markup for conference events
  Adds structured data for better SEO and search engine understanding
{%- endcomment -%}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Event",
  "name": "{{ site.conference.title }}",
  "description": "{{ site.description | escape }}",
  "startDate": "{{ site.conference.key_dates | where_exp: 'item', 'item.label contains "Conference"' | first | map: 'date' | first }}",
  "endDate": "{{ site.conference.key_dates | where_exp: 'item', 'item.label contains "Conference"' | first | map: 'date' | first }}",
  "eventStatus": "https://schema.org/EventScheduled",
  "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode",
  "location": {
    "@type": "Place",
    "name": "{{ site.conference.location }}",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "{{ site.conference.city }}"
    }
  },
  "organizer": {
    "@type": "Organization",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}{{ site.baseurl }}"
  },
  {% if site.conference.registration.url %}
  "offers": {
    "@type": "Offer",
    "url": "{{ site.conference.registration.url }}",
    "price": "{{ site.conference.registration.prices.regular | remove: '$' }}",
    "priceCurrency": "USD",
    "availability": "https://schema.org/InStock",
    "validFrom": "{{ 'now' | date: '%Y-%m-%d' }}"
  },
  {% endif %}
  "subEvent": [
    {% assign events = site.data.events | sort: 'date' %}
    {% for event in events limit: 20 %}
    {
      "@type": "Event",
      "name": "{{ event.title | escape }}",
      "startDate": "{{ event.date }}T{{ event.start_time }}:00",
      "endDate": "{{ event.date }}T{{ event.end_time }}:00",
      "eventStatus": "https://schema.org/EventScheduled",
      "location": {
        "@type": "Place",
        "name": "{{ event.location | escape }}"
      }{% if event.description %},
      "description": "{{ event.description | strip_html | escape }}"
      {% endif %}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
